# Pipeline de base (jalon S3) : construire et démarrer OWASP WebGoat, vérifier qu'elle répond.
# À compléter au fil des séances : secrets, SAST, SCA, conteneur, IaC, DAST.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Construire et démarrer
        run: ./mvnw -B -q clean install -DskipTests && docker build -t app . && docker run -d -p 8080:8080 app
      - name: Vérifier que l'application répond
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L http://localhost:8080/WebGoat || true)
            case "$code" in 2*|3*) echo "HTTP $code"; exit 0;; esac
            sleep 5
          done
          echo "Pas de réponse (dernier code : $code)"; docker ps -a; exit 1
